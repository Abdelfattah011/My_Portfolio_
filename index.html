<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdelfattah Ahmed | Portfolio</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.85);
            --sub-bg: rgba(15, 23, 42, 0.04);
            --primary-green: #10b981;
            --primary-purple: #8b5cf6;
            --glow-green: rgba(16, 185, 129, 0.2);
            --glow-purple: rgba(139, 92, 246, 0.2);
            --border-color: rgba(0, 0, 0, 0.08);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-color: #050505;
            --text-color: #f8fafc;
            --card-bg: rgba(17, 17, 17, 0.75);
            --sub-bg: rgba(255, 255, 255, 0.03);
            --primary-green: #00ff88;
            --primary-purple: #b066ff;
            --glow-green: rgba(0, 255, 136, 0.15);
            --glow-purple: rgba(176, 102, 255, 0.15);
            --border-color: rgba(255, 255, 255, 0.07);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: var(--transition);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, var(--glow-green), transparent 40%),
                radial-gradient(circle at 85% 30%, var(--glow-purple), transparent 40%);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(5, 5, 5, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: var(--transition);
        }

        [data-theme="light"] nav {
            background: rgba(255, 255, 255, 0.6);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary-green), var(--primary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            color: var(--primary-green);
            transform: scale(1.1);
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4rem;
            min-height: 100vh;
            padding-top: 8rem;
            padding-bottom: 4rem;
            flex-wrap: wrap-reverse;
        }

        .hero-text {
            flex: 1;
            min-width: 320px;
        }

        .hero h1 {
            font-size: 4rem;
            line-height: 1.1;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .highlight-green {
            color: var(--primary-green);
        }

        .typing-container {
            display: inline-block;
            overflow: hidden;
            border-right: 2px solid var(--primary-purple);
            white-space: nowrap;
            letter-spacing: 2px;
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem;
            color: var(--primary-purple);
            animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
            margin-bottom: 2rem;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--primary-purple) } }

        .hero p {
            font-size: 1.15rem;
            opacity: 0.8;
            margin-bottom: 3rem;
            line-height: 1.8;
            max-width: 600px;
        }

        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .image-wrapper {
            position: relative;
            width: 350px;
            height: 350px;
            border-radius: 30px;
            animation: float 6s ease-in-out infinite;
        }

        .image-wrapper::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 35px;
            background: linear-gradient(45deg, var(--primary-green), var(--primary-purple));
            z-index: -1;
            filter: blur(20px);
            opacity: 0.7;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; filter: blur(20px); }
            100% { opacity: 0.8; filter: blur(30px); }
        }

        .cta-btn {
            background: transparent;
            color: var(--text-color);
            border: 2px solid var(--primary-green);
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--primary-green);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s ease;
        }

        .cta-btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .cta-btn:hover {
            color: #000;
            box-shadow: 0 0 20px var(--glow-green);
            border-color: transparent;
        }

        section {
            padding: 6rem 0;
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .section-title {
            font-size: 2.8rem;
            margin-bottom: 4rem;
            text-align: center;
            font-weight: 700;
        }

        .section-title span {
            color: var(--primary-purple);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2.5rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.8rem 2.2rem;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--primary-purple);
            box-shadow: 0 15px 35px var(--glow-purple);
        }

        .card i.card-icon {
            font-size: 2.5rem;
            background: linear-gradient(45deg, var(--primary-green), var(--primary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .card .company {
            font-size: 0.95rem;
            color: var(--primary-green);
            margin-bottom: 1.5rem;
            font-family: 'Fira Code', monospace;
        }

        .card p {
            font-size: 1.05rem;
            opacity: 0.8;
            line-height: 1.7;
            flex-grow: 1;
        }

        /* تنسيق STAR Method للمشاريع */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 2.5rem;
        }

        .star-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.5rem;
            flex-grow: 1;
        }

        .star-item {
            background: var(--sub-bg);
            padding: 1rem 1.2rem;
            border-radius: 14px;
            border-left: 3px solid var(--primary-purple);
            transition: var(--transition);
        }

        .star-item:nth-child(even) {
            border-left-color: var(--primary-green);
        }

        .star-item:hover {
            transform: translateX(4px);
            background: var(--glow-purple);
        }

        .star-item:nth-child(even):hover {
            background: var(--glow-green);
        }

        .star-badge {
            display: inline-block;
            font-family: 'Fira Code', monospace;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.35rem;
            color: var(--primary-purple);
        }

        .star-item:nth-child(even) .star-badge {
            color: var(--primary-green);
        }

        .star-text {
            font-size: 0.95rem;
            line-height: 1.6;
            opacity: 0.88;
        }

        /* تنسيق روابط المشاريع */
        .project-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 2rem;
            padding: 0.8rem 1.5rem;
            background: var(--sub-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            align-self: flex-start;
        }

        .project-link i {
            font-size: 1.2rem;
            color: var(--primary-green);
        }

        .project-link:hover {
            border-color: var(--primary-green);
            background: var(--glow-green);
            transform: translateY(-3px) translateX(5px);
            color: var(--primary-green);
        }

        /* تنسيق قسم المهارات الجديد (Categories) */
        .skills-categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2.5rem;
        }

        .skill-category-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .skill-category-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary-green);
            box-shadow: 0 15px 35px var(--glow-green);
        }

        .skill-category-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .skill-category-header i {
            font-size: 2rem;
            background: linear-gradient(45deg, var(--primary-green), var(--primary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .skill-category-header h3 {
            font-size: 1.35rem;
            font-weight: 600;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .skill-tag {
            padding: 0.65rem 1.2rem;
            background: var(--sub-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .skill-tag i {
            color: var(--primary-green);
            font-size: 0.85rem;
        }

        .skill-tag.highlight-skill {
            border-color: rgba(0, 255, 136, 0.35);
            background: var(--glow-green);
        }

        .skill-tag:hover {
            border-color: var(--primary-green);
            color: var(--primary-green);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px var(--glow-green);
        }

        .contact-grid {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 2rem 3rem;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--border-color
